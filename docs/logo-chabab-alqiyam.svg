<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%" fill="none">
  <!-- Official Logo: Chabab Alqiyam - Tamest Municipal Cohort (Transparent Background) -->
  <defs>
    <!-- Gold Gradient for Figures and Calligraphy -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbb024" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Deep Green Gradient for Center Badge -->
    <linearGradient id="emeraldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005a3e" />
      <stop offset="50%" stop-color="#004630" />
      <stop offset="100%" stop-color="#003524" />
    </linearGradient>

    <!-- Text Green Gradient -->
    <linearGradient id="greenTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#005a3e" />
      <stop offset="100%" stop-color="#00432c" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="translate(0, 5)">
    <!-- 1. The Central Mandala: 8 Solidarity Figures -->
    <g transform="translate(250, 180)">
      
      <!-- Connective Solidarity Ring (Torso/Arms) -->
      <!-- 8-pointed solidarity lotus ring formed by connecting arcs -->
      <path d="
        M 0 -130
        C 25 -130, 48 -112, 60 -90
        C 75 -95, 95 -75, 90 -60
        C 112 -48, 130 -25, 130 0
        C 130 25, 112 48, 90 60
        C 95 75, 75 95, 60 90
        C 48 112, 25 130, 0 130
        C -25 130, -48 112, -60 90
        C -75 95, -95 75, -90 60
        C -112 48, -130 25, -130 0
        C -130 -25, -112 -48, -90 -60
        C -95 -75, -75 -95, -60 -90
        C -48 -112, -25 -130, 0 -130 Z"
        fill="url(#goldGrad)"
        filter="url(#subtleShadow)"
      />

      <!-- The 8 Golden Heads of the Figures -->
      <!-- Top -->
      <circle cx="0" cy="-148" r="16" fill="url(#goldGrad)" filter="url(#subtleShadow)" />
      <!-- Top-Right -->
      <circle cx="105" cy="-105" r="16" fill="url(#goldGrad)" filter="url(#subtleShadow)" />
      <!-- Right -->
      <circle cx="148" cy="0" r="16" fill="url(#goldGrad)" filter="url(#subtleShadow)" />
      <!-- Bottom-Right -->
      <circle cx="105" cy="105" r="16" fill="url(#goldGrad)" filter="url(#subtleShadow)" />
      <!-- Bottom -->
      <circle cx="0" cy="148" r="16" fill="url(#goldGrad)" filter="url(#subtleShadow)" />
      <!-- Bottom-Left -->
      <circle cx="-105" cy="105" r="16" fill="url(#goldGrad)" filter="url(#subtleShadow)" />
      <!-- Left -->
      <circle cx="-148" cy="0" r="16" fill="url(#goldGrad)" filter="url(#subtleShadow)" />
      <!-- Top-Left -->
      <circle cx="-105" cy="-105" r="16" fill="url(#goldGrad)" filter="url(#subtleShadow)" />

      <!-- Center Emerald Circular Disc -->
      <circle cx="0" cy="0" r="76" fill="url(#emeraldBadge)" stroke="#d97706" stroke-width="2.5" />

      <!-- Golden Arabic Calligraphy: «قيم» in the Center -->
      <!-- Qaf dots (top diamonds) -->
      <g fill="url(#goldGrad)">
        <polygon points="-8,-48 -2,-54 4,-48 -2,-42" />
        <polygon points="4,-56 10,-62 16,-56 10,-50" />
      </g>

      <!-- The Calligraphic stroke of Qaf - Ya - Meem -->
      <path d="
        M -12 -38
        C -4 -42, 6 -40, 14 -32
        C 22 -24, 20 -10, 8 -6
        C -6 -2, -18 -12, -14 -24
        C -11 -33, -3 -36, 6 -36
        C 18 -36, 26 -20, 22 2
        C 18 20, 2 34, -14 38
        C -26 41, -38 34, -42 22
        C -45 12, -40 2, -28 -2
        C -18 -5, -4 4, 10 6
        C 28 8, 44 -2, 54 -12
        C 58 -16, 62 -22, 60 -24
        C 58 -26, 52 -22, 46 -16
        C 34 -4, 18 0, 4 -2
        C -10 -4, -20 -12, -18 -22
        C -16 -32, -4 -38, 8 -36
        C 18 -34, 20 -22, 14 -12
        C 10 -4, 0 0, -8 0
        Z"
        fill="url(#goldGrad)"
      />

      <!-- Ya dots (two bottom diamonds) -->
      <g fill="url(#goldGrad)">
        <polygon points="46,18 52,12 58,18 52,24" />
        <polygon points="46,32 52,26 58,32 52,38" />
      </g>

    </g>

    <!-- 2. Typography: Clean, Modern, Scalable Arabic & Latin text -->
    <g text-anchor="middle">
      <!-- Line 1: «شــبــاب الــقــيــم» -->
      <text
        x="250"
        y="395"
        fill="url(#greenTextGrad)"
        font-family="'Cairo', 'Amiri', 'Segoe UI', system-ui, sans-serif"
        font-size="44"
        font-weight="900"
        letter-spacing="0.04em"
      >
        شــبــاب الــقــيــم
      </text>

      <!-- Line 2: «CHABAB ALQIYAM» -->
      <text
        x="250"
        y="440"
        fill="url(#goldGrad)"
        font-family="'Plus Jakarta Sans', 'Arial', sans-serif"
        font-size="22"
        font-weight="800"
        letter-spacing="0.22em"
      >
        CHABAB ALQIYAM
      </text>

      <!-- Line 3: «الفوج البلدي تامست» -->
      <text
        x="250"
        y="492"
        fill="url(#greenTextGrad)"
        font-family="'Cairo', 'Amiri', 'Segoe UI', system-ui, sans-serif"
        font-size="34"
        font-weight="800"
        letter-spacing="0.02em"
      >
        الفوج البلدي تامست
      </text>
    </g>
  </g>
</svg>
