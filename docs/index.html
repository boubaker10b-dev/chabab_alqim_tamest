    <script>
      // Ensure trailing slash for GitHub Pages repository subpaths
      (function() {
        var p = window.location.pathname;
        if (p.length > 1 && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + p + '/' + window.location.search + window.location.hash);
          return;
        }

        // If hosted on GitHub Pages and serving uncompiled root, redirect to compiled /docs/
        window.addEventListener('DOMContentLoaded', function() {
          var uncompiledScript = document.querySelector('script[src*="main.tsx"]');
          if (uncompiledScript && window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
            var path = window.location.pathname;
            if (!path.endsWith('/')) path += '/';
            window.location.replace(window.location.protocol + '//' + window.location.host + path + 'docs/');
          }
        });
      })();
    </script>
