<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>مشروع شباب القيم تامست - جاري التوجيه...</title>
    <script>
      // Clean GitHub Pages redirect to project root
      try {
        sessionStorage.redirect = location.href;
      } catch (e) {}
      var repoSegment = location.pathname.split('/')[1];
      if (repoSegment && location.hostname.endsWith('github.io')) {
        location.replace('/' + repoSegment + '/');
      } else {
        location.replace('./');
      }
    </script>
    <meta http-equiv="refresh" content="0;URL='./'" />
  </head>
  <body style="font-family: system-ui, sans-serif; text-align: center; padding: 40px; background: #f6faf8; color: #003a29;">
    <h2>جاري تحويلك إلى الصفحة الرئيسية لمشروع شباب القيم تامست...</h2>
    <p>إذا لم يتم التحويل تلقائياً، <a href="./" style="color: #0d533d; font-weight: bold;">اضغط هنا للانتقال مباشرة</a></p>
  </body>
</html>
